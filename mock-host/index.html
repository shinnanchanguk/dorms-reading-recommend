<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연습용 도름스 · 학생 도서 추천</title>
    <style>
      body { margin: 0; font-family: "SUIT Variable", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; background: #ECEDEA; color: #242824; word-break: keep-all; overflow-wrap: break-word; }
      header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; background: #F7F8F4; border-bottom: 1px solid #C4C9C1; }
      header h1 { font-size: 1rem; margin: 0 12px 0 0; }
      label { font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
      select, input, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #C4C9C1; background: #FDFDF9; color: inherit; }
      button { cursor: pointer; }
      main { padding: 16px; }
      .frame-wrap { width: min(760px, 100%); padding: 24px 28px; border: 1px solid #C4C9C1; border-radius: 14px; background: #F7F8F4; }
      iframe { display: block; width: 100%; min-height: 420px; border: 0; background: transparent; }
      #log { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: #F7F8F4; font-size: .85rem; white-space: pre-wrap; max-height: 240px; overflow: auto; }
      .hint { margin: 10px 0 0; font-size: .85rem; color: #5C635D; }
    </style>
  </head>
  <body>
    <header>
      <h1>연습용 도름스</h1>
      <label>내 자리
        <select id="level">
          <option value="anyone">손님</option>
          <option value="login">로그인한 회원</option>
          <option value="teacher">인증 교사</option>
          <option value="operator" selected>책을 운영하는 분</option>
        </select>
      </label>
      <label>화면
        <input id="path" value="../dist/index.html" size="24" />
      </label>
      <label>색
        <select id="theme">
          <option value="light" selected>밝은 화면</option>
          <option value="dark">어두운 화면</option>
        </select>
      </label>
      <button id="reload" type="button">다시 띄우기</button>
      <button id="reset" type="button">연습 기록 지우기</button>
    </header>
    <main>
      <div class="frame-wrap"><iframe id="frame" sandbox="allow-scripts" title="학생 도서 추천 연습 화면"></iframe></div>
      <p class="hint">여기서 담은 추천 도서는 이 컴퓨터의 연습 기록에만 남아요. 진짜 도름스에는 아무것도 보내지 않아요.</p>
      <pre id="log">여기에 화면이 도름스에 무엇을 물어봤는지 적힙니다.</pre>
    </main>
    <script src="fixtures.js"></script>
    <script src="host.js"></script>
  </body>
</html>
